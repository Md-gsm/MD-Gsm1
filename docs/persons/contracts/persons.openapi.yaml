openapi: 3.1.0
info:
  title: MD-Gsm Persons API
  version: 2.0.0
  description: >
    Versioned contract. The protected party-details GET endpoint is implemented and requires a validated IdentityAccess session and server-side permission checks. Search remains contract-only. Natural/legal registration POST routes always use duplicate resolution and are implemented behind Persons:WriteApiEnabled (default false); no lower-level HTTP route bypasses the quick-registration decision. Enabling writes is not authorized until the independent Persons G1/release gates pass.
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost
security:
  - opaqueBearer: []
paths:
  /api/v2/persons:
    get:
      operationId: searchParties
      summary: Search active parties by name or last four mobile digits
      description: >-
        A term is required: either a name of at least two characters or exactly four digits matching the end of a mobile number.
        At most 10 results are returned and mobile numbers are masked (only the last two digits are visible).
        Per-actor rate limiting remains a required policy for the future search endpoint; no search HTTP route is currently exposed.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 160 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        '200':
          description: Party list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyListResponse' }
        '401': { description: Missing, invalid, expired, or revoked opaque session token }
        '403': { description: Authenticated user lacks Persons read permission }
    post:
      operationId: quickRegisterNaturalParty
      summary: Resolve or register a natural person
      description: >-
        Every natural-person creation path performs duplicate resolution. Requires persons.create and persons.read.
        Existing candidates require explicit selection unless ForceNew is set. Actor is derived from the validated server session.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickRegisterNaturalPartyRequest' }
      x-feature-flag: Persons:WriteApiEnabled
      responses:
        '201': { description: A new Party was created }
        '200': { description: An existing Party was reused, the operation was replayed, or candidate selection is required }
        '401': { description: Missing or invalid session }
        '403': { description: Missing read or create permission }
        '409': { description: Cross-actor idempotency replay or invalid selected candidate }
        '422': { description: Validation failure }
        '503': { description: Persons write API is disabled }
  /api/v2/persons/legal:
    post:
      operationId: quickRegisterLegalParty
      summary: Resolve or register a legal entity
      description: >-
        Every legal-entity creation path performs duplicate resolution. Requires persons.create and persons.read.
        Existing candidates require explicit selection unless ForceNew is set. Actor is derived from the validated server session.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickRegisterLegalPartyRequest' }
      x-feature-flag: Persons:WriteApiEnabled
      responses:
        '201': { description: A new legal Party was created }
        '200': { description: An existing legal Party was reused, the operation was replayed, or candidate selection is required }
        '401': { description: Missing or invalid session }
        '403': { description: Missing read or create permission }
        '409': { description: Cross-actor idempotency replay or invalid selected candidate }
        '422': { description: Validation failure }
        '503': { description: Persons write API is disabled }
  /api/v2/persons/{partyId}:
    get:
      operationId: getParty
      summary: Read one party
      description: >-
        Every read is audited with the server-derived actor. Sensitive fields are masked or omitted unless
        includeSensitive is true and the server authorizes the caller. The response is mapped to the
        versioned PartyResponse contract. Finance-owned credit limits, pricing discounts and payment-instrument
        metadata are not part of the Persons contract.
      parameters:
        - in: path
          name: partyId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: includeSensitive
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Party details mapped to the published Persons response contract
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyResponse' }
        '401': { description: Missing or invalid session }
        '403': { description: Missing read permission or sensitive-read authorization }
        '404': { description: Party not found }
components:
  securitySchemes:
    opaqueBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Random opaque token. The server stores only its cryptographic hash and
        checks session/account/revocation state against PostgreSQL on every request.
  schemas:
    QuickRegisterNaturalPartyRequest:
      type: object
      required: [party]
      properties:
        party: { $ref: '#/components/schemas/CreateNaturalPartyRequest' }
        forceNew: { type: boolean, default: false }
        selectedPartyId: { type: string, format: uuid, nullable: true }
    QuickRegisterLegalPartyRequest:
      type: object
      required: [party]
      properties:
        party: { $ref: '#/components/schemas/CreateLegalPartyRequest' }
        forceNew: { type: boolean, default: false }
        selectedPartyId: { type: string, format: uuid, nullable: true }
    PartyQuickRegistrationCandidate:
      type: object
      required: [partyId, partyType, displayName, roles, partyIsActive, isMerged, hasActiveMobile, maskedMobile]
      properties:
        partyId: { type: string, format: uuid }
        partyType: { type: string, enum: [NaturalPerson, LegalEntity] }
        displayName: { type: string }
        roles: { type: array, items: { type: string, enum: [Customer, Colleague] } }
        partyIsActive: { type: boolean }
        isMerged: { type: boolean }
        hasActiveMobile: { type: boolean }
        maskedMobile: { type: string }
    PartyQuickRegistrationResponse:
      type: object
      required: [outcome, created, candidates]
      properties:
        outcome: { type: string, enum: [Created, ExistingPartyMatched, SelectionRequired, Replayed] }
        partyId: { type: string, format: uuid, nullable: true }
        created: { type: boolean }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/PartyQuickRegistrationCandidate' }
    PartyAddress:
      type: object
      required: [countryCode, province, city, postalCode, addressLine]
      properties:
        countryCode: { type: string, minLength: 2, maxLength: 2, default: IR }
        province: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 20 }
        addressLine: { type: string, maxLength: 1000 }
    CommunicationPreferences:
      type: object
      properties:
        repairStatusSmsEnabled: { type: boolean, default: true }
        readyForDeliverySmsEnabled: { type: boolean, default: true }
        promotionsSmsEnabled: { type: boolean, default: false }
    CreateNaturalPartyRequest:
      type: object
      required: [givenName, familyName, roles]
      properties:
        givenName: { type: string, maxLength: 120 }
        familyName: { type: string, maxLength: 160 }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [Customer, Colleague] }
        nationalId: { type: [string, 'null'], pattern: '^[0-9]{10}$' }
        primaryMobile: { type: [string, 'null'] }
        alternateMobile: { type: [string, 'null'] }
        landline: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        address: { anyOf: [{ $ref: '#/components/schemas/PartyAddress' }, { type: 'null' }] }
        communication: { $ref: '#/components/schemas/CommunicationPreferences' }
        acquaintanceSource: { type: [string, 'null'] }
        internalNote: { type: [string, 'null'], maxLength: 2000 }
    CreateLegalPartyRequest:
      type: object
      required: [legalName, roles]
      properties:
        legalName: { type: string, maxLength: 300 }
        legalNationalId: { type: [string, 'null'], pattern: '^[0-9]{11}$' }
        economicCode: { type: [string, 'null'], pattern: '^[0-9]{10,14}$' }
        responsiblePersonName: { type: [string, 'null'], maxLength: 200 }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [Customer, Colleague] }
        primaryMobile: { type: [string, 'null'] }
        alternateMobile: { type: [string, 'null'] }
        landline: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        address    PartyResponse:
      type: object
      required: [partyId, partyType, displayName, roles, contacts, createdAtUtc, sensitiveFieldsIncluded]
      properties:
        partyId: { type: string, format: uuid }
        partyType: { type: string, enum: [NaturalPerson, LegalEntity] }
        displayName: { type: string }
        roles: { type: array, items: { type: string, enum: [Customer, Colleague] } }
        nationalIdentifier: { type: [string, 'null'] }
        economicCode: { type: [string, 'null'] }
        responsiblePersonName: { type: [string, 'null'] }
        contacts:
          type: array
          items:
            type: object
            required: [kind, value, isPrimary, isMessagingAllowed]
            properties:
              kind: { type: string, enum: [Mobile, Landline, Email] }
              value: { type: string, description: Masked unless sensitive-read permission is granted. }
              isPrimary: { type: boolean }
              isMessagingAllowed: { type: boolean }
        primaryAddress: { anyOf: [{ $ref: '#/components/schemas/PartyAddress' }, { type: 'null' }] }
        communication: { anyOf: [{ $ref: '#/components/schemas/CommunicationPreferences' }, { type: 'null' }] }
        acquaintanceSource: { type: [string, 'null'] }
        createdAtUtc: { type: string, format: date-time }
        sensitiveFieldsIncluded: { type: boolean }
        workClassification: { type: [string, 'null'] }
: { anyOf: [{ $ref: '#/components/schemas/PartyAddress' }, { type: 'null' }] }
        communication: { $ref: '#/components/schemas/CommunicationPreferences' }
        acquaintanceSource: { type: [string, 'null'] }
        internalNote: { type: [string, 'null'], maxLength: 2000 }
    PartyListResponse:
      type: object
      required: [items, limit, hasMore]
      properties:
        items: { type: array, items: { type: object } }
        limit: { type: integer }
        hasMore: { type: boolean }
