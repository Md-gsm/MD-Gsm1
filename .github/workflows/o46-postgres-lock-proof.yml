name: O-46 Historical Reader-View PostgreSQL Lock Proof (Not Current Acceptance)

# Historical evidence only. This workflow exercises the superseded Reader/View
# design with synthetic objects. It MUST NOT be treated as proof of the v0.4
# exact-replay architecture. Run manually only when reproducing historical PR #120.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o46-historical-reader-view-proof-${{ github.sha }}
  cancel-in-progress: true

jobs:
  historical-reader-view-proof:
    name: historical-reader-view-proof-not-current-o46-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify pinned PostgreSQL version
        run: |
          set -euo pipefail
          version="$(psql -XAtqc 'SHOW server_version;')"
          version_num="$(psql -XAtqc 'SHOW server_version_num;')"
          [[ "$version" == 18.6* ]]
          [[ "$version_num" == 180006 ]]
          printf 'PostgreSQL server verified: %s (%s)\\n' "$version" "$version_num"
      - name: Run historical Reader-View lock proof (not exact-replay proof)
        shell: bash
        run: bash scripts/ci/test_o46_postgres_lock_proof.sh
      - name: Upload redacted historical transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: o46-historical-reader-view-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/o46-lock-proof-summary.txt
          if-no-files-found: warn
          retention-days: 14
