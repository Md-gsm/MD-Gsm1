name: MD-Gsm Persons Module Gates

on:
  # Main commits and every proposed PR are validated; feature branch pushes are covered by PR events.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation-build-test:
    name: foundation-build-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\MDGsm.sln
      - name: Build Release
        run: dotnet build .\MDGsm.sln --configuration Release --no-restore
      - name: Test Release
        run: dotnet test .\MDGsm.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=mdgsm-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundation-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  persons-spec-lint:
    name: persons-spec-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_persons_gates.py --gate spec
      - name: Test IdentityAccess username policy oracle
        run: python -m unittest scripts/ci/test_identityaccess_policy.py -v
      - name: Verify SHA256SUMS.txt matches tracked files
        run: python scripts/ci/verify_source_checksums.py

  persons-architecture-boundary:
    name: persons-architecture-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_persons_gates.py --gate architecture

  persons-consumer-registry:
    name: persons-consumer-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_persons_gates.py --gate registry

  persons-api-contract:
    name: persons-api-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_persons_gates.py --gate api

  persons-temporary-data-retention:
    name: persons-temporary-data-retention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_persons_gates.py --gate retention

  persons-merge-contract:
    name: persons-merge-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_persons_gates.py --gate merge

  persons-postgres-migrations:
    name: persons-postgres-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          # Runner-local disposable service only; avoid committing a reusable/static credential.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore application migrator
        run: |
          dotnet restore tools/MDGsm.DbMigrator/MDGsm.DbMigrator.csproj
          dotnet restore tests/MDGsm.Domain.Tests/MDGsm.Domain.Tests.csproj
      - name: Create marked disposable database (psql is used only for database bootstrap)
        shell: bash
        run: |
          set -euo pipefail
          db="mdgsm_ci_disposable_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          [[ "$db" =~ ^mdgsm_ci_disposable_[0-9]+_[0-9]+$ ]]
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$db\";"
          psql -d postgres -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE \"$db\" IS 'MDGSM_DISPOSABLE_TEST_DB; created by Linux PostgreSQL CI';"
          echo "MDGSM_TEST_DB=$db" >> "$GITHUB_ENV"
          echo "ConnectionStrings__MDGsmDatabase=Host=127.0.0.1;Port=5432;Database=$db;Username=postgres;Timeout=15;Command Timeout=120" >> "$GITHUB_ENV"
          identity_db="mdgsm_identityaccess_disposable_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          [[ "$identity_db" =~ ^mdgsm_identityaccess_disposable_[0-9]+_[0-9]+$ ]]
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$identity_db\";"
          psql -d postgres -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE \"$identity_db\" IS 'MDGSM_DISPOSABLE_TEST_DB; IdentityAccess integration test only';"
          echo "IdentityAccessTestConnectionString=Host=127.0.0.1;Port=5432;Database=$identity_db;Username=postgres;Timeout=15;Command Timeout=120" >> "$GITHUB_ENV"
      - name: Apply migrations through the application-owned runner and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tools/MDGsm.DbMigrator/MDGsm.DbMigrator.csproj --configuration Release --no-restore
          dotnet run --project tools/MDGsm.DbMigrator/MDGsm.DbMigrator.csproj --configuration Release --no-build
          history="$(psql -d "$MDGSM_TEST_DB" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*)::text || '|' || max(migration_version)::text FROM mdgsm_migration_history;")"
          test "$history" = '3|3'
          schema_version="$(psql -d "$MDGSM_TEST_DB" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*)::text || '|' || max(version)::text FROM mdgsm_schema_version;")"
          test "$schema_version" = '1|1'
          identity_tables="$(psql -d "$MDGSM_TEST_DB" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'identity' AND table_type = 'BASE TABLE';")"
          test "$identity_tables" = '11'
          session_policy="$(psql -d "$MDGSM_TEST_DB" -tA -v ON_ERROR_STOP=1 -c "SELECT max_active_users::text || '|' || heartbeat_interval_seconds::text || '|' || session_lease_seconds::text FROM identity.system_settings WHERE settings_id = 1;")"
          test "$session_policy" = '5|30|180'
          audit_trigger="$(psql -d "$MDGSM_TEST_DB" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_trigger WHERE tgname = 'trg_identity_security_audit_no_update_delete' AND NOT tgisinternal;")"
          test "$audit_trigger" = '1'
          psql -d "$MDGSM_TEST_DB" -v ON_ERROR_STOP=1 -c "CREATE ROLE mdgsm_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -d "$MDGSM_TEST_DB" -v ON_ERROR_STOP=1 -f database/operations/identityaccess-runtime-role-grants.sql
          grant_checks="$(psql -d "$MDGSM_TEST_DB" -tA -v ON_ERROR_STOP=1 -c "SELECT (has_table_privilege('mdgsm_runtime','identity.sessions','SELECT') AND has_table_privilege('mdgsm_runtime','identity.sessions','INSERT'))::text || '|' || has_column_privilege('mdgsm_runtime','identity.sessions','revoked_at_utc','UPDATE')::text || '|' || has_table_privilege('mdgsm_runtime','identity.security_audit_events','INSERT')::text || '|' || has_table_privilege('mdgsm_runtime','identity.security_audit_events','UPDATE')::text || '|' || has_table_privilege('mdgsm_runtime','identity.accounts','INSERT')::text || '|' || has_schema_privilege('mdgsm_runtime','identity','CREATE')::text;")"
          test "$grant_checks" = 'true|true|true|false|false|false'
          # The grant script is intentionally safe to re-apply after reviewed schema changes.
          psql -d "$MDGSM_TEST_DB" -v ON_ERROR_STOP=1 -f database/operations/identityaccess-runtime-role-grants.sql
          backup_file="$RUNNER_TEMP/mdgsm-staging-smoke.backup"
          restore_db="mdgsm_restore_disposable_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          [[ "$restore_db" =~ ^mdgsm_restore_disposable_[0-9]+_[0-9]+$ ]]
          pg_dump --format=custom --file "$backup_file" "$MDGSM_TEST_DB"
          createdb "$restore_db"
          pg_restore --exit-on-error --dbname "$restore_db" "$backup_file"
          restored_history="$(psql -d "$restore_db" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*)::text || '|' || max(migration_version)::text FROM mdgsm_migration_history;")"
          test "$restored_history" = '4|4'
          reservation_indexes="$(psql -d "$restore_db" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('ux_persons_natural_national_id','ux_persons_legal_national_id') AND indexdef NOT ILIKE '%is_active%';")"
          test "$reservation_indexes" = '2'
          psql -d "$restore_db" -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            INSERT INTO persons (party_id, party_type, business_roles, given_name, family_name, national_id, created_by, updated_by, is_active)
            VALUES ('10000000-0000-7000-8000-000000000001', 1, 1, 'آزمون', 'غیرفعال', '9876543210', 'ci', 'ci', false);
            BEGIN
              INSERT INTO persons (party_id, party_type, business_roles, given_name, family_name, national_id, created_by, updated_by)
              VALUES ('10000000-0000-7000-8000-000000000002', 1, 1, 'آزمون', 'تکراری', '9876543210', 'ci', 'ci');
              RAISE EXCEPTION 'Inactive natural-person national identifier was reused.';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            INSERT INTO persons (party_id, party_type, business_roles, legal_name, legal_national_id, created_by, updated_by, is_active)
            VALUES ('20000000-0000-7000-8000-000000000001', 2, 1, 'شرکت غیرفعال آزمون', '12345678901', 'ci', 'ci', false);
            BEGIN
              INSERT INTO persons (party_id, party_type, business_roles, legal_name, legal_national_id, created_by, updated_by)
              VALUES ('20000000-0000-7000-8000-000000000002', 2, 1, 'شرکت تکراری آزمون', '12345678901', 'ci', 'ci');
              RAISE EXCEPTION 'Inactive legal-person national identifier was reused.';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END $;
          SQL
          restored_identity_tables="$(psql -d "$restore_db" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'identity' AND table_type = 'BASE TABLE';")"
          test "$restored_identity_tables" = '11'
          restored_audit_trigger="$(psql -d "$restore_db" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_trigger WHERE tgname = 'trg_identity_security_audit_no_update_delete' AND NOT tgisinternal;")"
          test "$restored_audit_trigger" = '1'
          echo "PASS: migrations, repeat/idempotence, IdentityAccess schema invariants, least-privilege grants, and backup/restore verification passed."
      - name: Run Persons PostgreSQL end-to-end integration test
        run: dotnet test tests/MDGsm.Domain.Tests/MDGsm.Domain.Tests.csproj --configuration Release --filter "Category=Integration" --no-restore
  persons-postgres-windows-migrations:
    name: persons-postgres-windows-migrations
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Install verified PostgreSQL 18.6-5 and test application-owned migrations on Windows
        shell: pwsh
        run: .\scripts\Invoke-PostgreSQL18WindowsMigrationTest.ps1

  persons-security-tests:
    name: persons-security-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_persons_gates.py --gate security

  persons-e2e-disposable:
    name: persons-e2e-disposable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python scripts/ci/validate_persons_gates.py --gate e2e

  persons-ci-enforcement-test:
    name: persons-ci-enforcement-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Test fail-closed gate policy
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Verify required gate manifest and mappings
        run: python scripts/ci/validate_persons_gates.py --gate ci-enforcement

  persons-ci-evidence:
    name: persons-ci-evidence
    if: always()
    needs:
      - foundation-build-test
      - persons-spec-lint
      - persons-architecture-boundary
      - persons-consumer-registry
      - persons-api-contract
      - persons-temporary-data-retention
      - persons-merge-contract
      - persons-postgres-migrations
      - persons-postgres-windows-migrations
      - persons-security-tests
      - persons-e2e-disposable
      - persons-ci-enforcement-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Download .NET TRX summary source when available
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: foundation-test-results
          path: artifacts/test-results
        continue-on-error: true
      - name: Build commit-bound redacted evidence
        if: always()
        env:
          GATE_NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/ci/write_ci_evidence.py --root . --out artifacts/persons-ci-evidence.json
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: persons-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/persons-ci-evidence.json
          if-no-files-found: error
      - name: Enforce every required gate and test passed
        if: always()
        env:
          GATE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/write_ci_evidence.py --root . --out artifacts/persons-ci-evidence.json --enforce
