name: MD-Gsm Windows Persons Preview Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/MDGsm.Desktop/**'
      - 'src/MDGsm.Client/**'
      - 'tests/**'
      - 'installer/**'
      - 'scripts/Build-Windows-Installer.ps1'
      - 'MDGsm.sln'
      - '.github/workflows/windows-preview-installer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-preview-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and package self-contained preview installer
        shell: pwsh
        run: .\scripts\Build-Windows-Installer.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MD-Gsm-Persons-Preview-Installer-v0.2.10
          path: artifacts/installer/MD-Gsm-Persons-Preview-Setup-v0.2.10.exe*
          if-no-files-found: error
