name: MD-Gsm Windows Persons Preview Installer

on:
  workflow_dispatch:
  # Always runs on every PR (no path filter) so it can be a required check without blocking docs-only PRs.
  pull_request:
  push:
    paths:
      - 'src/Host/Desktop/**'
      - 'src/Host/Api/**'
      - 'src/BuildingBlocks/**'
      - 'src/Modules/**'
      - 'database/migrations/**'
      - 'tools/MDGsm.DbMigrator/**'
      - 'tests/**'
      - 'installer/**'
      - 'scripts/Build-Windows-Installer.ps1'
      - 'MDGsm.sln'
      - '.github/workflows/windows-preview-installer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-preview-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and package self-contained preview installer
        shell: pwsh
        run: .\scripts\Build-Windows-Installer.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MD-Gsm-Persons-Preview-Installer-v0.2.10
          path: artifacts/installer/MD-Gsm-Persons-Preview-Setup-v0.2.10.exe*
          if-no-files-found: error
