name: MD-Gsm Windows Persons Preview Installer

on:
  workflow_dispatch:
    inputs:
      require_code_signing:
        description: 'Fail the build unless a trusted Authenticode certificate is configured'
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - 'src/MDGsm.Desktop/**'
      - 'src/MDGsm.Client/**'
      - 'installer/**'
      - 'scripts/Build-Windows-Installer.ps1'
      - 'scripts/Sign-Windows-Authenticode.ps1'
      - 'tests/MDGsm.Domain.Tests/**'
      - 'scripts/ci/**'
      - 'MDGsm.sln'
      - '.github/workflows/windows-preview-installer.yml'
  push:
    paths:
      - 'src/MDGsm.Desktop/**'
      - 'src/MDGsm.Client/**'
      - 'installer/**'
      - 'scripts/Build-Windows-Installer.ps1'
      - 'scripts/Sign-Windows-Authenticode.ps1'
      - 'tests/MDGsm.Domain.Tests/**'
      - 'scripts/ci/**'
      - 'MDGsm.sln'
      - '.github/workflows/windows-preview-installer.yml'

permissions:
  contents: read

jobs:
  windows-preview-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build, optionally sign, and package self-contained preview
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
          REQUIRE_CODE_SIGNING: ${{ inputs.require_code_signing }}
        run: |
          if ($env:REQUIRE_CODE_SIGNING -eq 'true') {
            .\scripts\Build-Windows-Installer.ps1 -RequireAuthenticodeSignature
          }
          else {
            .\scripts\Build-Windows-Installer.ps1
          }
      - name: Upload Windows installer and signature status
        uses: actions/upload-artifact@v4
        with:
          name: MD-Gsm-Persons-Preview-Installer-v0.2.11
          path: artifacts/installer/*
          if-no-files-found: error
